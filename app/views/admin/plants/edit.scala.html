@(plant: models.Plant, user: Option[models.User])

@views.html.main("Modifier " + plant.getName(), user) {
	<h1>Modifier @plant.getName()</h1>
	<form id="plant-edit-form" data-id="@plant.getId()">
		<div class="mb-3">
			<label class="form-label">Nom</label>
			<input type="text" class="form-control" id="plant-name" value="@plant.getName()" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Description</label>
			<textarea class="form-control" id="plant-description">@plant.getDescription()</textarea>
		</div>
		<div class="mb-3">
			<label class="form-label">Prix</label>
			<input type="number" class="form-control" id="plant-price" value="@plant.getPrice()" min="1" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Stock</label>
			<input type="number" class="form-control" id="plant-stock" value="@plant.getStock()" min="0" required>
		</div>
		<button type="submit" class="btn btn-primary">Enregistrer</button>
		<a href="/admin/plants" class="btn btn-secondary ms-2">Annuler</a>
	</form>
}
